<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!--

    <title>
        Calidad del Aire
    </title>


    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>


<body>


<main class="contenedor">


    <header class="cabecera">

        <h1>
            Calidad del Aire
        </h1>

        <p>
            Monitorización ambiental
        </p>

    </header>


    <section class="tarjeta">


        <h2>
            Última medición
        </h2>


        <div class="contenido-medicion">


            <!-- Datos de la medición -->

            <div class="datos">


                <div class="dato">

                    <span class="etiqueta">
                        Tipo
                    </span>

                    <span
                        id="tipo"
                        class="valor"
                    >
                        -
                    </span>

                </div>


                <div class="dato">

                    <span class="etiqueta">
                        Valor
                    </span>

                    <span
                        id="valor"
                        class="valor valor-principal"
                    >
                        -
                    </span>

                </div>


                <div class="dato">

                    <span class="etiqueta">
                        Fecha
                    </span>

                    <span
                        id="fecha"
                        class="valor"
                    >
                        -
                    </span>

                </div>


                <div class="dato">

                    <span class="etiqueta">
                        Hora
                    </span>

                    <span
                        id="hora"
                        class="valor"
                    >
                        -
                    </span>

                </div>


            </div>


            <!-- Controles -->

            <div class="controles">


                <button id="botonActualizar">

                    Actualizar

                </button>


                <span id="ultimaActualizacion">

                    Todavía no se ha actualizado

                </span>


            </div>


        </div>


        <div id="estado"></div>


    </section>


</main>


<script src="js/LogicaFake.js"></script>

<script src="js/app.js"></script>


</body>

</html>
